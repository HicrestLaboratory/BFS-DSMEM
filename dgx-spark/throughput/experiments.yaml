# SbatchMan batch definition: the throughput / transfer sweep.
#
# Run from THIS directory (the job's working directory is where you launch):
#     sbatchman launch -f experiments.yaml
#     sbatchman launch -f experiments.yaml -t 'dsmem*'     # only the DSMEM jobs
#
# SbatchMan takes the cartesian product of the `variables` used by a command
# and substitutes {name}. Tags become directory names under
# SbatchMan/experiments/<cluster>/<config>/<tag>/<timestamp>/, so each tag
# carries the parameters that identify the job.

variables:
  reps: [101]
  steps: [16384]

jobs:
  # DSMEM vs the traditional copy-back through GMEM (supervisor: "how much does
  # DSMEM cost compared to copy-back to GMEM and/or TMA?"). Every method moves
  # S bytes from one SM's shared memory to another's, synchronization
  # included, on the fastest (10 -> 11) and slowest (0 -> 1) DSMEM pair.
  # Plot with: python plot_transfer.py
  - config: local
    variables:
      reps: [11]
      method: [dsmem-pull, dsmem-push, dsmem-bulk, gmem-ldst, gmem-tma]
      mode: [pingpong, stream]
      bytes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
    command: "../../build/transfer --method {method} --mode {mode} --bytes {bytes} --src {src} --dst {dst} --reps {reps}"
    config_jobs:
      - tag: "transfer_{method}_{mode}_b{bytes}_p{src}-{dst}"
        variables: {src: [10], dst: [11]}
      - tag: "transfer_{method}_{mode}_b{bytes}_p{src}-{dst}"
        variables: {src: [0], dst: [1]}
  # Synchronization alone: a flag handshake with no payload, and one
  # cluster-wide barrier.
  - config: local
    variables:
      reps: [11]
    command: "../../build/transfer --method {method} --mode {mode} --bytes 0 --src {src} --dst {dst} --reps {reps}"
    config_jobs:
      - tag: "transfer_{method}_{mode}_b0_p{src}-{dst}"
        variables: {method: [dsmem-pull, dsmem-push, gmem-ldst], mode: [pingpong, stream], src: [10], dst: [11]}
      - tag: "transfer_{method}_{mode}_b0_p{src}-{dst}"
        variables: {method: [dsmem-pull, dsmem-push, gmem-ldst], mode: [pingpong, stream], src: [0], dst: [1]}
      - tag: "transfer_{method}_{mode}_b0_p{src}-{dst}"
        variables: {method: [cluster-sync], mode: [pingpong], src: [10], dst: [11]}

  # Unbalanced all-to-all among the 12 blocks of one cluster (a2av.cu): every
  # block delivers a different number of bytes to every other block, as in the
  # frontier exchange of a 2D-partitioned BFS. The sizes come from the axccl
  # traces in traces/ (one per distribution, 12 ranks; see a2av.cu), so the
  # imbalance is the one the lab uses for its MPI experiments.
  # The largest --avg-msgsize that fits in shared memory depends on the
  # distribution: the more the busiest block sends, the earlier it stops.
  - config: local
    variables:
      reps: [21]
      block_size: [256]
      method: [cluster-sync, dsmem-push, dsmem-pull, dsmem-bulk, gmem-ldst, gmem-tma]
    command: "../../build/a2av --trace traces/ALL2ALLV_{distribution}_pairs.log --avg-msgsize {avg_msgsize} --method {method} --block-size {block_size} --reps {reps}"
    config_jobs:
      - tag: "a2av_{distribution}_avg_msgsize_{avg_msgsize}_{method}"
        variables: {distribution: [UNIMODALFLAT], avg_msgsize: [16, 32, 64, 128, 256, 512, 1024, 2048]}
      - tag: "a2av_{distribution}_avg_msgsize_{avg_msgsize}_{method}"
        variables: {distribution: [UNIMODALPEAK, HEAVYTAIL], avg_msgsize: [16, 32, 64, 128, 256, 512, 1024]}
      - tag: "a2av_{distribution}_avg_msgsize_{avg_msgsize}_{method}"
        variables: {distribution: [MONOTONEDECAY], avg_msgsize: [16, 32, 64, 128, 256, 512]}

  # Bandwidth of an SM's own shared memory (smem_bandwidth.cu), one block per
  # SM on every SM: what DSMEM's ~10-17 GB/s per SM should be compared with.
  - config: local
    tag: smem_bandwidth_{op}_width_{width}
    variables:
      reps: [21]
      op: [read, write]
      width: [4, 8, 16]
    command: "../../build/smem_bandwidth --op {op} --width {width} --reps {reps}"
  # Bank conflicts: 4-byte reads, consecutive threads `stride` bytes apart
  # (4 = no conflict, 128 = all 32 threads of a warp in one bank).
  - config: local
    tag: smem_bandwidth_read_width_4_stride_{stride}
    variables:
      reps: [21]
      stride: [4, 8, 16, 32, 64, 128]
    command: "../../build/smem_bandwidth --op read --width 4 --stride {stride} --reps {reps}"
