# SbatchMan batch definition: how long one barrier takes (barriers.cu,
# barriers-shared.cu, barriers-l2.cu and barriers-gmem.cu).
#
# Run from THIS directory (the job's working directory is where you launch):
#     sbatchman launch -f experiments.yaml
#
# SbatchMan takes the cartesian product of the `variables` used by a command
# and substitutes {name}. Tags become directory names under
# SbatchMan/experiments/<cluster>/<config>/<tag>/<timestamp>/, so each tag
# carries the parameters that identify the job.
#
# The programs run the same sweep and time the same thing, end - start
# around ONE barrier, with one CSV row per thread per launch:
#   barriers         the paper's method. plots-naive.json shows every thread,
#                    plots-warp0.json only warp 0 (thread < 32): warp 0 does the work
#                    of the barrier, so its clock read is not early;
#   barriers-shared  + a shared-memory load after the barrier so the clock
#                    read cannot run early;
#   barriers-l2      the same with a load from L2;
#   barriers-gmem    the same with a load that misses L2 and goes to DRAM.
# 5 launches: a job with 12 blocks x 1024 threads is already 61440 rows.

variables:
  program: [barriers, barriers-shared, barriers-l2, barriers-gmem]
  reps: [5]
  block_size: [32, 64, 128, 256, 512, 1024]

jobs:
  # Block barrier: one block.
  - config: local
    tag: "{program}_{barrier}_blocks_1_block_size_{block_size}"
    variables:
      barrier: [syncthreads]
    command: "../../build/{program} --barrier {barrier} --blocks 1 --block-size {block_size} --reps {reps}"

  # Cluster barriers (one cluster of {blocks} blocks) and grid barrier
  # (a cooperative launch of {blocks} blocks).
  - config: local
    tag: "{program}_{barrier}_blocks_{blocks}_block_size_{block_size}"
    variables:
      barrier: [cluster, cluster-relaxed, grid]
      blocks: [2, 12]
    command: "../../build/{program} --barrier {barrier} --blocks {blocks} --block-size {block_size} --reps {reps}"

  # Every piece of cluster.sync() and every fence (plots-fence.json).
  - config: local
    tag: "fence_parts_cluster_size_{cluster_size}_block_size_{block_size}"
    variables:
      cluster_size: [1, 12]
    command: "../../build/fence parts --cluster-size {cluster_size} --block-size {block_size}"

  # One cluster of one block per SM, all at once: the cost of each SM's path.
  - config: local
    tag: "fence_placement_cluster_size_1"
    command: "../../build/fence placement --cluster-size 1"

  # The L2 latency of every SM, for the table "cost by TPC position, for each
  # GPC" (tools/gpc_table.py), is the l2_topology job of ../extra/experiments.yaml.
