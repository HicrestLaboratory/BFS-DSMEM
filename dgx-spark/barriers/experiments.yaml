# SbatchMan batch definition: how long one barrier takes (barriers-naive.cu,
# barriers-shared.cu and barriers.cu).
#
# Run from THIS directory (the job's working directory is where you launch):
#     sbatchman launch -f experiments.yaml
#
# SbatchMan takes the cartesian product of the `variables` used by a command
# and substitutes {name}. Tags become directory names under
# SbatchMan/experiments/<cluster>/<config>/<tag>/<timestamp>/, so each tag
# carries the parameters that identify the job.
#
# The three programs run the same sweep and time the same thing, end - start
# around ONE barrier:
#   barriers-naive   the paper's method, one CSV row per thread per launch;
#   barriers-shared  + a shared-memory load after the barrier so the clock
#                    read cannot run early, one row per thread per launch;
#   barriers         the kernels of barriers-naive, but only thread 0 of each
#                    block is printed: the real cost (warp 0 does the work of
#                    the barrier, so its clock read is not early).
# 5 launches: a naive or shared job with 12 blocks x 1024 threads is already
# 61440 rows.

variables:
  program: [barriers-naive, barriers-shared, barriers]
  reps: [5]
  block_size: [32, 64, 128, 256, 512, 1024]

jobs:
  # Block barrier: one block.
  - config: local
    tag: "{program}_{barrier}_blocks_1_block_size_{block_size}"
    variables:
      barrier: [syncthreads]
    command: "../../build/{program} --barrier {barrier} --blocks 1 --block-size {block_size} --reps {reps}"

  # Cluster barriers (one cluster of {blocks} blocks) and grid barrier
  # (a cooperative launch of {blocks} blocks).
  - config: local
    tag: "{program}_{barrier}_blocks_{blocks}_block_size_{block_size}"
    variables:
      barrier: [cluster, cluster-relaxed, grid]
      blocks: [2, 12]
    command: "../../build/{program} --barrier {barrier} --blocks {blocks} --block-size {block_size} --reps {reps}"
